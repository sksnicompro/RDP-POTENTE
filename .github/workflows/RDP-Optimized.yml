name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        run: |
          sudo apt-get update
          sudo apt-get install -y xrdp xfce4 xfce4-terminal

      - name: Create RDP User with Secure Password
        run: |
          PASSWORD="rdp1234"
          
          sudo useradd -m -s /bin/bash rdp 2>/dev/null || true
          echo "rdp:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo rdp 2>/dev/null || true
          
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Configure XRDP Server
        run: |
          # Crear directorio config
          sudo mkdir -p /home/rdp/.config
          sudo chown -R rdp:rdp /home/rdp/.config
          
          # Script de inicio XFCE sin D-Bus
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/bash
          export LANG=en_US.UTF-8
          xfce4-session &
          EOF
          
          sudo chmod +x /etc/xrdp/startwm.sh
          
          # Iniciar XRDP
          sudo systemctl start xrdp
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Open RDP Port
        run: |
          sudo ufw allow 3389/tcp 2>/dev/null || true
          sudo iptables -A INPUT -p tcp --dport 3389 -j ACCEPT 2>/dev/null || true

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              if [ -z "$TS_IP" ]; then
                  sleep 5
                  ((RETRIES++))
              fi
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP not assigned"
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          echo "Tailscale IP: ${{ env.TAILSCALE_IP }}"
          
          if sudo systemctl is-active --quiet xrdp; then
              echo "XRDP Server is running!"
          else
              echo "Error: XRDP not running"
              exit 1
          fi

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== RDP ACCESS ==="
          echo "Address: ${{ env.TAILSCALE_IP }}"
          echo "Port: 3389"
          echo "Username: rdp"
          echo "Password: ${{ env.RDP_PASSWORD }}"
          echo "===================="
          echo ""
          
          while true; do
              echo "[$(date)] RDP Active - Use Ctrl+C in workflow to terminate"
              sleep 300
          done
