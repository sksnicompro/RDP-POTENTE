name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install VNC Server
        run: |
          sudo apt-get update
          sudo apt-get install -y tightvncserver xfce4 xfce4-terminal dbus-x11

      - name: Create RDP User with Secure Password
        run: |
          PASSWORD=$(openssl rand -base64 12 | tr -dc 'A-Za-z0-9!@#$%' | head -c 16)
          
          sudo useradd -m -s /bin/bash rdp || true
          echo "rdp:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo rdp
          
          echo "RDP_CREDS=User: rdp | Password: $PASSWORD" >> $GITHUB_ENV
          echo "RDP_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Configure VNC Server
        run: |
          sudo mkdir -p /home/rdp/.vnc
          sudo chown rdp:rdp /home/rdp/.vnc
          
          echo "${{ env.RDP_PASSWORD }}" | vncpasswd -f > /tmp/passwd
          sudo mv /tmp/passwd /home/rdp/.vnc/passwd
          sudo chown rdp:rdp /home/rdp/.vnc/passwd
          sudo chmod 600 /home/rdp/.vnc/passwd
          
          sudo tee /home/rdp/.vnc/xstartup > /dev/null <<EOF
          #!/bin/bash
          xrdb $HOME/.Xresources
          startxfce4 &
          EOF
          
          sudo chown rdp:rdp /home/rdp/.vnc/xstartup
          sudo chmod +x /home/rdp/.vnc/xstartup

      - name: Start VNC Server
        run: |
          sudo -u rdp tightvncserver :1 -geometry 768x768 -depth 32

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              if [ -z "$TS_IP" ]; then
                  sleep 5
                  ((RETRIES++))
              fi
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Error: Tailscale IP not assigned"
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Verify VNC Accessibility
        run: |
          echo "Tailscale IP: ${{ env.TAILSCALE_IP }}"
          
          if sudo netstat -tulpn | grep :5901 || sudo netstat -tulpn | grep :5900; then
              echo "VNC port is listening!"
          else
              echo "Checking VNC status..."
          fi

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== VNC ACCESS ==="
          echo "Address: ${{ env.TAILSCALE_IP }}:5900"
          echo "Username: rdp"
          echo "Password: ${{ env.RDP_PASSWORD }}"
          echo "====================="
          echo ""
          
          while true; do
              echo "[$(date)] VNC Server Active"
              sleep 300
          done
